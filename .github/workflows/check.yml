name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install catalogue and lint tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Check the committed catalogue and execute six editions
        run: make check PYTHON=python
      - name: Require reproducible generated HTML
        run: |
          make docs PYTHON=python
          git diff --exit-code -- index.html code/
      - name: Preserve this run's execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: execution-report
          path: build/check-report.json
          if-no-files-found: warn
          retention-days: 14
